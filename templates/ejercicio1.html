<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title> Formulario de Notas</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div class="contenedor">
            <h2>Formulario de Notas</h2>
            <form method="POST" class="form-caja">
                <label for="nota1">Nota 1:</label>
                <input type="number" step="any" min="10" max="70" id="nota1" name="nota1" required>

                <label for="nota2">Nota 2:</label>
                <input type="number" step="any" min="10" max="70" id="nota2" name="nota2" required>

                <label for="nota3">Nota 3:</label>
                <input type="number" step="any" min="10" max="70" id="nota3" name="nota3" required>

                <label for="asistencia">Asistencia (%):</label>
                <input type="number" step="any" min="0" max="100" id="asistencia" name="asistencia" required>

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
            {% if error %}
                <p class="mensaje-error">{{ error }}</p>
            {% endif %}

            {% if promedio is not none %}
                <div class="resultado">
                    <p>{{ promedio }}</p>
                    <p>{{ estado }}</p>
                </div>
            {% endif %}
            
            <a href="{{ url_for('index') }}" class="enlace-volver">Volver al menú</a>
        </div>
    </body>
</html>
